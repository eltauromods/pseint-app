name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir proyecto (si se subio como zip)
        run: |
          for z in *.zip; do if [ -f "$z" ]; then unzip -q -o "$z" -d proyecto_src; fi; done
          S=$(find . -maxdepth 4 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -not -path './.git/*' | head -1)
          if [ -n "$S" ]; then
            echo "PROJ_DIR=$(dirname "$S")" >> "$GITHUB_ENV"
          else
            echo "PROJ_DIR=." >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"
          accept-android-sdk-licenses: true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        working-directory: ${{ env.PROJ_DIR }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: |
          mkdir -p salida
          APK_PATH=$(find . -path '*build/outputs/apk/release/*.apk' | head -1)
          cp "$APK_PATH" salida/PSeInt-Web.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PSeInt-Web-APK
          path: salida/PSeInt-Web.apk
